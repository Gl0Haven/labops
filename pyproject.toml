[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labops"
version = "0.1.0"
description = "Local control plane for AI coding agents: tasks, reviews, gates, GPU queue, alerts and desktop-session messaging (Windows)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []
classifiers = ["Operating System :: Microsoft :: Windows", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
mcp = ["mcp==2.3.0", "mcp-types==2.3.0"]

[project.scripts]
labops = "labops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
